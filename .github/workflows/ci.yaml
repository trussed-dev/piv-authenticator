name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.0
      - run: gh actions-lock --verify
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/trussed-dev/piv-authenticator
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: start pcscd
        run: pcscd -d -f --disable-polkit
        id: pcscd
        background: true
      - name: Install rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Run tests
        run: make ci
      - name: Upload tarpaulin html report
        uses: actions/upload-artifact@v7
        with:
          name: tarpaulin-html-report
          path: tarpaulin-report.html
      - name: Upload tarpaulin xml report
        uses: actions/upload-artifact@v7
        with:
          name: tarpaulin-xml-report
          path: tarpaulin-report.xml
      - name: Stop pcscd
        cancel: pcscd
